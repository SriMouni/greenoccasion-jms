name: Deploy To Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'greenoccasion' }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO || 'greenoccasion' }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE || 'greenoccasion-db' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Build
        run: npm run ci:check

      - name: Validate GCP Auth Configuration
        id: auth_mode
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail

          if [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" && -n "${GCP_SERVICE_ACCOUNT_EMAIL}" ]]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${GCP_CREDENTIALS_JSON}" ]]; then
            echo "mode=json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Missing Google Cloud authentication settings." >&2
          echo "Provide either:" >&2
          echo "  1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT_EMAIL" >&2
          echo "  2) GCP_CREDENTIALS_JSON" >&2
          exit 1

      - name: Authenticate To Google Cloud (WIF)
        if: steps.auth_mode.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate To Google Cloud (Credentials JSON)
        if: steps.auth_mode.outputs.mode == 'json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build And Deploy With Cloud Build
        run: |
          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --substitutions=_SERVICE="${CLOUD_RUN_SERVICE}",_REGION="${GCP_REGION}",_REPO="${ARTIFACT_REPO}",_CLOUD_SQL_INSTANCE="${CLOUD_SQL_INSTANCE}",_DB_USER="${{ secrets.DB_USER }}",_DB_PASSWORD="${{ secrets.DB_PASSWORD }}",_DB_NAME="${{ secrets.DB_NAME }}",_DB_HOST="${{ secrets.DB_HOST }}",_GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME }}",_ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}",_ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
